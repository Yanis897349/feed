[tools]
go = "1.25"

[tasks.news]
description = "Show recent InvestingLive articles (for example: mise run news -- 30m)"
run = "go run ."

[tasks.format]
description = "Format all Go source files"
run = "go fmt ./..."

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.build]
description = "Build the application"
run = "go build -o bin/investinglive-news ."

[tasks.check]
description = "Format, vet, and test the project"
depends = ["format"]
run = "go vet ./... && go test ./..."
